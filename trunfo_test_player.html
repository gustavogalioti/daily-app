<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY TRUNFO — Teste do Jogador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --wood-1:#1b120c; --wood-2:#2e1f16; --wood-grain: rgba(0,0,0,.25); --paper:#f4ead9; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,180,90,.06), transparent 55%),
      repeating-linear-gradient(115deg, var(--wood-grain) 0px, transparent 2px, transparent 40px),
      linear-gradient(160deg, var(--wood-2), var(--wood-1) 70%);
    font-family:'VT323', monospace; color:var(--paper);
    padding:16px 14px 50px;
  }
  .pf{ font-family:'Press Start 2P'; }
  .hd{ text-align:center; margin-bottom:14px; }
  .eyebrow{ font-size:8px; letter-spacing:2px; color:#ff9d4d; margin-bottom:10px; }
  .h1{ font-size:14px; color:#fff3e6; }

  .balance{ display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
  .coin-box{ background:#2a231c; border:2px solid #59452f; padding:8px 14px; font-size:17px; }
  .coin-box b{ color:#ffd35c; }
  .coin-box.frag b{ color:#7ec8ff; }

  .tabs{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; max-width:520px; margin:0 auto 14px; }
  .tab-btn{ font-size:8px; color:#d8c6ae; background:#2a231c; border:2px solid #59452f; padding:9px 11px; cursor:pointer; }
  .tab-btn.active{ background:#ff9d4d; color:#1b120c; border-color:#b5691f; }

  .prog{ text-align:center; font-size:14px; color:#a99575; margin-bottom:12px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px; max-width:560px; margin:0 auto; }
  .tile{
    aspect-ratio:63/92; border-radius:4px; position:relative;
    background:#1a1512; border:3px solid var(--frame,#59452f); box-shadow:0 0 8px var(--glow,transparent) inset;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px;
  }
  .tile.locked{ filter:grayscale(1) brightness(.4); }
  .tile .art{ width:100%; height:55%; position:relative; }
  .tile .art img{ width:100%; height:100%; object-fit:cover; border-radius:2px; }
  .tile .nm{ font-size:8px; text-align:center; line-height:1.2; }
  .tile .qty{ position:absolute; top:2px; right:2px; font-size:9px; background:#ff9d4d; color:#1b120c; border-radius:8px; padding:1px 5px; }
  .tile .lock{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:20px; }

  .r-incomum{ --frame:#9aa3ad; --glow:#c7ced4; }
  .r-raro{ --frame:#2fae66; --glow:#7cf7b0; }
  .r-epico{ --frame:#2f7bce; --glow:#7ec8ff; }
  .r-lendario{ --frame:#8b4fd1; --glow:#cfa0ff; }
  .r-mitico{ --frame:#d1a12f; --glow:#ffe28a; }
  .r-cosmico{ --frame:#d1352f; --glow:#ff8f7e; }
  .r-noturno{ --frame:#151515; --glow:#00f0ff; }

  #gate{ max-width:400px; margin:60px auto; text-align:center; font-size:16px; color:#d8c6ae; }
</style>
</head>
<body>

  <div class="hd">
    <div class="eyebrow pf">DAILY · TESTE</div>
    <div class="h1 pf">MEU TRUNFO (DADOS REAIS)</div>
  </div>

  <div id="gate" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="balance">
      <div class="coin-box">🪙 <b id="coins">0</b></div>
      <div class="coin-box frag">🔷 <b id="frags">0</b></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="prog" id="prog"></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
const token = localStorage.getItem('daily_token');
const COLL_KEYS = ['animais','carros','paises','filmes','bichos'];
const COLL_LABELS = { animais:'🐾 Animais', carros:'🚗 Carros', paises:'🌎 Países', filmes:'🎬 Filmes', bichos:'🐕 Bichos' };
let activeColl = 'animais';

async function api(path){
  const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
  if (!res.ok) throw new Error('Erro ' + res.status);
  return res.json();
}

async function init(){
  if (!token) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Faça login no Daily neste navegador primeiro.';
    return;
  }
  try {
    const me = await api('/api/trunfo/me');
    document.getElementById('coins').textContent = me.coins;
    document.getElementById('frags').textContent = me.fragments;
    document.getElementById('app').style.display = 'block';
    buildTabs();
    await loadCollection(activeColl);
  } catch(e) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Erro: ' + e.message;
  }
}

function buildTabs(){
  document.getElementById('tabs').innerHTML = COLL_KEYS.map(k => `
    <button class="tab-btn pf ${k===activeColl?'active':''}" data-key="${k}">${COLL_LABELS[k]}</button>
  `).join('');
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = async () => { activeColl = btn.dataset.key; buildTabs(); await loadCollection(activeColl); };
  });
}

async function loadCollection(collKey){
  const data = await api('/api/trunfo/me/collection?collection=' + collKey);
  const ownedCount = data.cards.filter(c => c.owned).length;
  document.getElementById('prog').textContent = `${ownedCount}/${data.cards.length} cartas obtidas`;
  document.getElementById('grid').innerHTML = data.cards.map(c => `
    <div class="tile r-${c.rarity} ${c.owned ? '' : 'locked'}">
      ${c.owned ? `
        <div class="art">${c.image_url ? `<img src="${c.image_url}" alt="${c.name}">` : ''}</div>
        <div class="nm">${c.name}</div>
        ${c.quantity > 1 ? `<div class="qty">x${c.quantity}</div>` : ''}
      ` : `<div class="lock">🔒</div>`}
    </div>
  `).join('');
}

init();
</script>

</body>
</html>
