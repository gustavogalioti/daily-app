<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY TRUNFO — Teste do Jogador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --wood-1:#1b120c; --wood-2:#2e1f16; --wood-grain: rgba(0,0,0,.25); --paper:#f4ead9; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,180,90,.06), transparent 55%),
      repeating-linear-gradient(115deg, var(--wood-grain) 0px, transparent 2px, transparent 40px),
      linear-gradient(160deg, var(--wood-2), var(--wood-1) 70%);
    font-family:'VT323', monospace; color:var(--paper);
    padding:16px 14px 50px;
  }
  .pf{ font-family:'Press Start 2P'; }
  .hd{ text-align:center; margin-bottom:14px; }
  .eyebrow{ font-size:8px; letter-spacing:2px; color:#ff9d4d; margin-bottom:10px; }
  .h1{ font-size:14px; color:#fff3e6; }

  .balance{ display:flex; gap:10px; justify-content:center; margin-bottom:16px; }
  .coin-box{ background:#2a231c; border:2px solid #59452f; padding:8px 14px; font-size:17px; }
  .coin-box b{ color:#ffd35c; }
  .coin-box.frag b{ color:#7ec8ff; }

  .tabs{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; max-width:520px; margin:0 auto 14px; }
  .tab-btn{ font-size:8px; color:#d8c6ae; background:#2a231c; border:2px solid #59452f; padding:9px 11px; cursor:pointer; }
  .tab-btn.active{ background:#ff9d4d; color:#1b120c; border-color:#b5691f; }

  .prog{ text-align:center; font-size:14px; color:#a99575; margin-bottom:12px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px; max-width:560px; margin:0 auto; }
  .tile{ aspect-ratio:63/92; position:relative; }
  .tile.locked{ background:#1a1512; border:3px solid #3a2c1f; border-radius:4px; }
  .tile .qty{ position:absolute; top:2px; right:2px; font-size:9px; background:#ff9d4d; color:#1b120c; border-radius:8px; padding:1px 5px; z-index:3; }

  .r-incomum{ --frame:#9aa3ad; --glow:#c7ced4; }
  .r-raro{ --frame:#2fae66; --glow:#7cf7b0; }
  .r-epico{ --frame:#2f7bce; --glow:#7ec8ff; }
  .r-lendario{ --frame:#8b4fd1; --glow:#cfa0ff; }
  .r-mitico{ --frame:#d1a12f; --glow:#ffe28a; }
  .r-cosmico{ --frame:#d1352f; --glow:#ff8f7e; }
  .r-noturno{ --frame:#151515; --glow:#00f0ff; }

  #gate{ max-width:400px; margin:60px auto; text-align:center; font-size:16px; color:#d8c6ae; }

  /* ===== CARTA COMPLETA (pixel frame + atributos) ===== */
  .tr-card{ --accent:#e7ebee; width:100%; aspect-ratio:63/92; position:relative; }
  .r-raro .tr-card{ --accent:#c7ffdf; } .r-epico .tr-card{ --accent:#cfeaff; }
  .r-lendario .tr-card{ --accent:#ecdbff; } .r-mitico .tr-card{ --accent:#fff3cf; }
  .r-cosmico .tr-card{ --accent:#ffd9d3; } .r-noturno .tr-card{ --accent:#00f0ff; }
  .tr-card-inner{ position:relative; width:100%; height:100%; background:#12100e; }
  .tr-frame{ position:absolute; inset:0; padding:7px; background:var(--frame);
    box-shadow:0 0 0 3px #0d0b0a, inset 0 0 0 2px rgba(0,0,0,.35);
    clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px)); }
  .tr-frame::after{ content:""; position:absolute; inset:4px; box-shadow:0 0 14px 1px var(--glow) inset,0 0 8px 1px var(--glow); opacity:.55; pointer-events:none; }
  .tr-face{ position:relative; height:100%; background:#1a1512; display:flex; flex-direction:column; overflow:hidden; border:2px solid rgba(0,0,0,.5); }
  .tr-topbar{ display:flex; align-items:center; justify-content:space-between; padding:4px 6px 2px; }
  .tr-code{ font-size:10px; color:#cbb98f; }
  .tr-gem{ width:11px; height:11px; background:var(--accent); clip-path:polygon(50% 0,100% 35%,82% 100%,18% 100%,0 35%); box-shadow:0 0 6px 1px var(--glow); }
  .tr-art{ margin:0 6px; flex:1 1 auto; border:2px solid rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:26px; overflow:hidden; }
  .tr-art img{ width:100%; height:100%; object-fit:cover; }
  .tr-nameplate{ margin:5px 6px 0; text-align:center; padding:3px; background:linear-gradient(180deg,#2a231c,#171310); border:2px solid rgba(0,0,0,.5); }
  .tr-name{ font-family:'Press Start 2P'; font-size:7px; color:var(--accent); line-height:1.4; }
  .tr-rarity{ text-align:center; font-family:'Press Start 2P'; font-size:5px; color:var(--frame); margin-top:4px; letter-spacing:1px; }
  .tr-attrs{ padding:4px 6px 6px; display:flex; flex-direction:column; gap:3px; }
  .tr-attr{ display:grid; grid-template-columns:12px 1fr 20px; align-items:center; gap:4px; font-size:10px; }
  .tr-attr-bar{ height:6px; background:#0d0b0a; border:1px solid rgba(0,0,0,.6); position:relative; overflow:hidden; }
  .tr-attr-bar>span{ position:absolute; inset:0; width:var(--val,50%); background:linear-gradient(90deg,var(--frame),var(--accent)); }
  .tr-attr-val{ text-align:right; }
  .tr-lockmark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; z-index:2; }
  .tile.locked .tr-card{ filter:grayscale(1) brightness(.35); }
</style>
</head>
<body>

  <div class="hd">
    <div class="eyebrow pf">DAILY · TESTE</div>
    <div class="h1 pf">MEU TRUNFO (DADOS REAIS)</div>
  </div>

  <div id="gate" style="display:none"></div>

  <div id="app" style="display:none">
    <div class="balance">
      <div class="coin-box">🪙 <b id="coins">0</b></div>
      <div class="coin-box frag">🔷 <b id="frags">0</b></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="prog" id="prog"></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
const token = localStorage.getItem('daily_token');
const COLL_KEYS = ['animais','carros','paises','filmes','bichos'];
const COLL_LABELS = { animais:'🐾 Animais', carros:'🚗 Carros', paises:'🌎 Países', filmes:'🎬 Filmes', bichos:'🐕 Bichos' };
let activeColl = 'animais';

async function api(path){
  const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + token } });
  if (!res.ok) throw new Error('Erro ' + res.status);
  return res.json();
}

async function init(){
  if (!token) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Faça login no Daily neste navegador primeiro.';
    return;
  }
  try {
    const me = await api('/api/trunfo/me');
    document.getElementById('coins').textContent = me.coins;
    document.getElementById('frags').textContent = me.fragments;
    document.getElementById('app').style.display = 'block';
    buildTabs();
    await loadCollection(activeColl);
  } catch(e) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('gate').textContent = 'Erro: ' + e.message;
  }
}

function buildTabs(){
  document.getElementById('tabs').innerHTML = COLL_KEYS.map(k => `
    <button class="tab-btn pf ${k===activeColl?'active':''}" data-key="${k}">${COLL_LABELS[k]}</button>
  `).join('');
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = async () => { activeColl = btn.dataset.key; buildTabs(); await loadCollection(activeColl); };
  });
}

async function loadCollection(collKey){
  const data = await api('/api/trunfo/me/collection?collection=' + collKey);
  const ownedCount = data.cards.filter(c => c.owned).length;
  document.getElementById('prog').textContent = `${ownedCount}/${data.cards.length} cartas obtidas`;
  document.getElementById('grid').innerHTML = data.cards.map(c => {
    if (!c.owned) {
      return `<div class="tile locked"><div class="tr-lockmark">🔒</div></div>`;
    }
    const attrsHTML = data.attrs.map(a => `
      <div class="tr-attr">
        <span>${a.icon}</span>
        <span class="tr-attr-bar"><span style="--val:${c.stats[a.key]}%"></span></span>
        <span class="tr-attr-val">${c.stats[a.key]}</span>
      </div>
    `).join('');
    return `
      <div class="tile r-${c.rarity}">
        ${c.quantity > 1 ? `<div class="qty">x${c.quantity}</div>` : ''}
        <div class="tr-card">
          <div class="tr-card-inner">
            <div class="tr-frame"></div>
            <div class="tr-face">
              <div class="tr-topbar"><span class="tr-code">${c.slug}</span><span class="tr-gem"></span></div>
              <div class="tr-art">${c.image_url ? `<img src="${c.image_url}" alt="${c.name}">` : ''}</div>
              <div class="tr-nameplate"><div class="tr-name">${c.name}</div></div>
              <div class="tr-rarity">${c.rarity.toUpperCase()}</div>
              <div class="tr-attrs">${attrsHTML}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

init();
</script>

</body>
</html>
