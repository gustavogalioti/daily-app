<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY - Teste Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:sans-serif;background:#f0f0f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.box{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.1);}
h1{font-size:32px;font-weight:900;margin-bottom:4px;}
h1 span{color:#ff6b35;}
p{font-size:13px;color:#888;margin-bottom:24px;}
.tabs{display:flex;gap:4px;background:#eee;border-radius:10px;padding:4px;margin-bottom:20px;}
.tab{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:#888;}
.tab.active{background:#fff;color:#ff6b35;}
label{font-size:13px;color:#666;display:block;margin-bottom:4px;}
input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;}
input:focus{border-color:#ff6b35;}
.btn{width:100%;padding:14px;background:#ff6b35;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn:hover{background:#e55a26;}
.msg{margin-top:12px;padding:12px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;display:none;}
.msg.error{background:#fee2e2;color:#991b1b;display:block;}
.msg.success{background:#d1fae5;color:#065f46;display:block;}
.bloco{display:none;flex-direction:column;}
.bloco.active{display:flex;}
</style>
</head>
<body>
<div class="box">
  <h1>D<span>.</span>AILY</h1>
  <p>Teste de login isolado</p>

  <div class="tabs">
    <button class="tab active" onclick="trocar('login')">Entrar</button>
    <button class="tab" onclick="trocar('cadastro')">Criar conta</button>
  </div>

  <div class="msg" id="msg"></div>

  <!-- LOGIN -->
  <div class="bloco active" id="bloco-login">
    <label>E-mail ou @usuário</label>
    <input type="text" id="l-login" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="l-senha" placeholder="••••••••">
    <button class="btn" onclick="fazerLogin()">Entrar →</button>
  </div>

  <!-- CADASTRO -->
  <div class="bloco" id="bloco-cadastro">
    <label>Nome completo</label>
    <input type="text" id="c-nome" placeholder="Seu nome">
    <label>@usuário</label>
    <input type="text" id="c-usuario" placeholder="seunome">
    <label>E-mail</label>
    <input type="email" id="c-email" placeholder="seu@email.com">
    <label>Senha</label>
    <input type="password" id="c-senha" placeholder="Mínimo 6 caracteres">
    <button class="btn" onclick="fazerCadastro()">Criar conta →</button>
  </div>
</div>

<script>
function trocar(aba) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.bloco').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('bloco-' + aba).classList.add('active');
  document.getElementById('msg').className = 'msg';
}

function mostrar(txt, tipo) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.className = 'msg ' + tipo;
}

async function fazerLogin() {
  const login = document.getElementById('l-login').value.trim();
  const senha = document.getElementById('l-senha').value;
  if (!login || !senha) { mostrar('Preencha e-mail e senha', 'error'); return; }
  mostrar('Entrando...', 'success');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, password: senha })
    });
    const d = await r.json();
    if (!r.ok) { mostrar(d.error || 'Erro ' + r.status, 'error'); return; }
    localStorage.setItem('daily_token', d.token);
    mostrar('Login OK! Redirecionando...', 'success');
    setTimeout(() => window.location.href = '/', 1000);
  } catch(e) {
    mostrar('Erro de conexão: ' + e.message, 'error');
  }
}

async function fazerCadastro() {
  const nome = document.getElementById('c-nome').value.trim();
  const usuario = document.getElementById('c-usuario').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const senha = document.getElementById('c-senha').value;
  if (!nome || !usuario || !email || !senha) { mostrar('Preencha todos os campos', 'error'); return; }
  if (senha.length < 6) { mostrar('Senha precisa ter pelo menos 6 caracteres', 'error'); return; }
  mostrar('Criando conta...', 'success');
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nome, username: usuario, email, password: senha })
    });
    const d = await r.json();
    if (!r.ok) { mostrar(d.error || 'Erro ' + r.status, 'error'); return; }
    localStorage.setItem('daily_token', d.token);
    mostrar('Conta criada! Entrando...', 'success');
    setTimeout(() => window.location.href = '/', 1000);
  } catch(e) {
    mostrar('Erro de conexão: ' + e.message, 'error');
  }
}
</script>
</body>
</html>
