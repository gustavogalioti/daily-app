<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cross Daily Station</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a14;font-family:'Segoe UI',system-ui,sans-serif;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px 0;background:linear-gradient(180deg,rgba(0,0,0,.75) 70%,transparent);z-index:100;pointer-events:none;}
#hud-left{pointer-events:none;}
#station-tag{font:700 10px/1 sans-serif;color:#F5C518;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
#dist-display{font:900 28px/1 sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);}
#dist-unit{font:700 10px/1 sans-serif;color:rgba(255,255,255,.45);letter-spacing:1px;margin-top:2px;}
#hud-center{pointer-events:none;text-align:center;}
#record-tag{font:600 9px/1.8 sans-serif;color:rgba(255,255,255,.4);letter-spacing:1px;text-transform:uppercase;}
#record-val{font:800 13px/1 sans-serif;color:#F5C518;}
#hud-right{pointer-events:all;display:flex;flex-direction:column;gap:5px;}
.hud-btn{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:20px;font:700 11px sans-serif;cursor:pointer;}
.hud-btn:active{background:rgba(255,255,255,.15);}

/* SCREENS */
.screen{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.screen.hidden{display:none!important;}

/* MENU */
#screen-menu{background:linear-gradient(150deg,#05050f,#0d1220);}
.logo-main{text-align:center;margin-bottom:24px;}
.logo-cross{font:900 clamp(32px,7vw,64px)/1 sans-serif;color:#fff;letter-spacing:-2px;}
.logo-daily{font:900 clamp(16px,3.5vw,32px)/1.3 sans-serif;color:#F5C518;letter-spacing:4px;text-transform:uppercase;}
.logo-station{font:700 10px/2.5 sans-serif;color:rgba(255,255,255,.3);letter-spacing:5px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.1);padding-top:6px;}
#menu-initials{width:68px;height:68px;border-radius:50%;border:3px solid #F5C518;background:#F5C518;display:flex;align-items:center;justify-content:center;font:900 26px sans-serif;color:#000;margin:0 auto 8px;}
#menu-avatar{width:68px;height:68px;border-radius:50%;border:3px solid #F5C518;object-fit:cover;display:none;margin:0 auto 8px;box-shadow:0 0 0 4px rgba(245,197,24,.15);}
.menu-name{font:700 14px sans-serif;color:#fff;margin-bottom:3px;text-align:center;}
.menu-rec{font:600 11px sans-serif;color:rgba(255,255,255,.4);text-align:center;}
.menu-btns{display:flex;flex-direction:column;gap:9px;width:min(280px,85vw);margin-top:20px;}
.mbtn{padding:14px 22px;border-radius:50px;border:none;font:800 13px sans-serif;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:transform .1s;}
.mbtn:active{transform:scale(.97);}
.mbtn-play{background:linear-gradient(135deg,#F5C518,#e0a800);color:#0a0800;box-shadow:0 8px 28px rgba(245,197,24,.4);}
.mbtn-rank{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.2);}
.mbtn-back{background:transparent;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);font-size:11px;}

/* GAME OVER */
#screen-gameover{background:rgba(4,4,16,.97);backdrop-filter:blur(20px);}
#go-av-wrap{position:relative;width:76px;height:76px;margin:0 auto 10px;}
#go-initials{width:76px;height:76px;border-radius:50%;border:3px solid #F5C518;background:#F5C518;display:flex;align-items:center;justify-content:center;font:900 26px sans-serif;color:#000;}
#go-avatar{width:76px;height:76px;border-radius:50%;border:3px solid #F5C518;object-fit:cover;display:none;position:absolute;top:0;left:0;}
#go-pulse{position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(245,197,24,.4);animation:pulse 1.5s ease-out infinite;}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.5);opacity:0}}
#go-name{font:700 12px sans-serif;color:rgba(255,255,255,.5);margin-bottom:4px;text-align:center;}
#go-title{font:900 clamp(18px,4vw,28px)/1.2 sans-serif;color:#fff;text-align:center;margin-bottom:3px;}
#go-sub{font:400 12px sans-serif;color:rgba(255,255,255,.35);text-align:center;margin-bottom:16px;}
#go-badge{background:linear-gradient(135deg,#F5C518,#e0a800);color:#0a0800;padding:4px 12px;border-radius:20px;font:800 10px sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:none;}
.go-stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
.go-stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 15px;text-align:center;min-width:76px;}
.go-sv{font:900 20px sans-serif;color:#F5C518;display:block;}
.go-sl{font:700 9px sans-serif;color:rgba(255,255,255,.3);letter-spacing:1.5px;text-transform:uppercase;}
.ch-title{font:700 10px sans-serif;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;text-align:center;}
.ch-input{width:min(290px,88vw);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;color:#fff;font:400 13px sans-serif;outline:none;margin-bottom:5px;}
.ch-input::placeholder{color:rgba(255,255,255,.25);}
#ch-results{width:min(290px,88vw);display:flex;flex-direction:column;gap:4px;max-height:90px;overflow-y:auto;margin-bottom:10px;}
.ch-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 10px;cursor:pointer;}
.ch-user:active{background:rgba(245,197,24,.15);}
.ch-uav{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#F5C518;display:flex;align-items:center;justify-content:center;font:700 10px sans-serif;color:#000;flex-shrink:0;}
.ch-uname{flex:1;font:600 12px sans-serif;color:#fff;}
.ch-ubtn{font:700 10px sans-serif;color:#F5C518;}
.go-btns{display:flex;flex-direction:column;gap:7px;width:min(280px,85vw);}

/* RANKING */
#screen-ranking{background:rgba(4,4,16,.97);backdrop-filter:blur(20px);padding:0;justify-content:flex-start;}
.rk-header{padding:12px 18px 10px;background:rgba(0,0,0,.3);width:100%;text-align:center;}
.rk-title{font:900 16px sans-serif;color:#F5C518;letter-spacing:3px;text-transform:uppercase;}
.rk-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.1);width:100%;}
.rk-tab{flex:1;padding:10px;font:700 11px sans-serif;color:rgba(255,255,255,.4);border:none;background:transparent;cursor:pointer;letter-spacing:1px;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px;}
.rk-tab.on{color:#F5C518;border-bottom-color:#F5C518;}
.rk-list{flex:1;overflow-y:auto;width:100%;padding:10px 14px;-webkit-overflow-scrolling:touch;}
.rk-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:6px;}
.rk-item.me{background:rgba(245,197,24,.08);border-color:rgba(245,197,24,.3);}
.rk-pos{font:900 15px sans-serif;color:#F5C518;width:22px;text-align:center;flex-shrink:0;}
.rk-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#F5C518;display:flex;align-items:center;justify-content:center;font:700 13px sans-serif;color:#000;}
.rk-info{flex:1;min-width:0;}
.rk-name{font:700 12px sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-user{font:400 10px sans-serif;color:rgba(255,255,255,.35);}
.rk-score{font:900 16px sans-serif;color:#F5C518;flex-shrink:0;}
.rk-close{display:block;width:calc(100% - 28px);margin:6px 14px 12px;padding:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:50px;color:rgba(255,255,255,.6);font:700 12px sans-serif;cursor:pointer;}

/* PAUSE */
#screen-pause{background:rgba(4,4,16,.9);backdrop-filter:blur(18px);}
#pause-title{font:900 38px sans-serif;color:#fff;letter-spacing:6px;margin-bottom:26px;}

/* RECORD FLASH */
#rec-flash{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font:900 clamp(16px,4vw,24px)/1.3 sans-serif;color:#F5C518;text-align:center;pointer-events:none;z-index:250;opacity:0;text-shadow:0 0 20px rgba(245,197,24,.8);}
#rec-flash.show{animation:flashAnim 2.5s forwards;}
@keyframes flashAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* LOADING */
#loading{position:fixed;inset:0;background:#0a0a14;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#loading-bar-wrap{width:180px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;}
#loading-bar{height:4px;background:#F5C518;border-radius:2px;width:0%;transition:width .3s;}

/* D-PAD */
#dpad{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:4px;z-index:150;opacity:.75;}
@media(pointer:coarse),(max-width:900px){#dpad{display:flex;}}
.drow{display:flex;gap:4px;}
.dbtn{width:52px;height:52px;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.3);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.dbtn:active{background:rgba(245,197,24,.25);border-color:#F5C518;}
</style>
</head>
<body>

<canvas id="gc"></canvas>

<!-- LOADING -->
<div id="loading">
  <div style="font-size:36px">🚇</div>
  <div style="font:900 16px sans-serif;color:#F5C518;letter-spacing:3px;">BARRA FUNDA</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div style="font:400 11px sans-serif;color:rgba(255,255,255,.3);">Carregando estação...</div>
</div>

<!-- HUD -->
<div id="hud" style="display:none;">
  <div id="hud-left">
    <div id="station-tag">🚇 Barra Funda</div>
    <div id="dist-display">0</div>
    <div id="dist-unit">METROS</div>
  </div>
  <div id="hud-center">
    <div id="record-tag">Recorde</div>
    <div id="record-val">—</div>
  </div>
  <div id="hud-right">
    <button class="hud-btn" onclick="pauseGame()">⏸ Pausar</button>
    <button class="hud-btn" onclick="showRanking()">🏆</button>
  </div>
</div>

<div id="rec-flash">🏆 NOVO RECORDE!</div>

<!-- MENU -->
<div class="screen" id="screen-menu">
  <div class="logo-main">
    <div class="logo-cross">CROSS</div>
    <div class="logo-daily">Daily</div>
    <div class="logo-station">Station</div>
  </div>
  <div id="menu-initials">J</div>
  <img id="menu-avatar" src="" alt="">
  <div id="menu-name" class="menu-name">Visitante</div>
  <div id="menu-rec" class="menu-rec">Sem recorde ainda</div>
  <div class="menu-btns">
    <button class="mbtn mbtn-play" onclick="startGame()">▶ JOGAR AGORA</button>
    <button class="mbtn mbtn-rank" onclick="showRanking()">🏆 Ranking</button>
    <button class="mbtn mbtn-back" onclick="goBackToDaily()">← Voltar ao DAILY</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="screen-gameover">
  <div id="go-av-wrap">
    <div id="go-initials">J</div>
    <img id="go-avatar" src="" alt="">
    <div id="go-pulse"></div>
  </div>
  <div id="go-name"></div>
  <div id="go-title">Fim de linha!</div>
  <div id="go-sub">Um passageiro cruzou seu caminho</div>
  <div id="go-badge">🏆 NOVO RECORDE!</div>
  <div class="go-stats">
    <div class="go-stat"><span class="go-sv" id="go-dist">0m</span><span class="go-sl">Distância</span></div>
    <div class="go-stat"><span class="go-sv" id="go-best">0m</span><span class="go-sl">Recorde</span></div>
    <div class="go-stat"><span class="go-sv" id="go-rank">#—</span><span class="go-sl">Ranking</span></div>
  </div>
  <div class="ch-title">Desafiar amigo</div>
  <input class="ch-input" id="ch-input" type="text" placeholder="🔍 Buscar usuário..." oninput="searchCh(this.value)">
  <div id="ch-results"></div>
  <div class="go-btns">
    <button class="mbtn mbtn-play" onclick="restartGame()">🔄 Jogar Novamente</button>
    <button class="mbtn mbtn-rank" onclick="showRanking()">🏆 Ranking</button>
    <button class="mbtn mbtn-back" onclick="goToMenu()">← Menu</button>
  </div>
</div>

<!-- RANKING -->
<div class="screen hidden" id="screen-ranking" style="justify-content:flex-start;">
  <div class="rk-header"><div class="rk-title">🏆 Ranking</div></div>
  <div class="rk-tabs">
    <button class="rk-tab on" id="rt-global" onclick="switchRkTab('global')">🌍 Global</button>
    <button class="rk-tab" id="rt-friends" onclick="switchRkTab('friends')">👥 Amigos</button>
  </div>
  <div class="rk-list" id="rk-list"></div>
  <button class="rk-close" onclick="closeRanking()">← Fechar</button>
</div>

<!-- PAUSE -->
<div class="screen hidden" id="screen-pause">
  <div id="pause-title">PAUSA</div>
  <div class="menu-btns">
    <button class="mbtn mbtn-play" onclick="resumeGame()">▶ Continuar</button>
    <button class="mbtn mbtn-rank" onclick="showRanking()">🏆 Ranking</button>
    <button class="mbtn mbtn-back" onclick="goToMenu()">← Menu</button>
  </div>
</div>

<!-- D-PAD -->
<div id="dpad">
  <div class="drow"><button class="dbtn" ontouchstart="dStart('up')" ontouchend="dEnd()">↑</button></div>
  <div class="drow">
    <button class="dbtn" ontouchstart="dStart('left')" ontouchend="dEnd()">←</button>
    <button class="dbtn" ontouchstart="dStart('down')" ontouchend="dEnd()">↓</button>
    <button class="dbtn" ontouchstart="dStart('right')" ontouchend="dEnd()">→</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CANVAS & RESIZE
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', ()=>{ resize(); if(gs==='playing') draw(); });

// ═══════════════════════════════════════════════════════════
// MAP LAYOUT — Fixed screen, isometric Barra Funda
// ═══════════════════════════════════════════════════════════
// Map image: 1086×1448 (portrait)
// The game renders the map scaled to fill the canvas.
// Lane positions as % of MAP HEIGHT (from pixel analysis):
//   Lane 0: 36.5%  (first yellow strip from top)
//   Lane 1: 45.9%
//   Lane 2: 55.9%
//   Lane 3: 67.2%
// Player columns: 7 across the floor area (~10%–90% of map width)
// Player start: bottom center, moves UP through lanes to reach top

const MAP_LANE_Y_PCT = [0.365, 0.459, 0.559, 0.672]; // 4 lanes
const LANE_DIR       = [-1, 1, -1, 1];               // alternate L/R
const COLS           = 7;
// Player X grid columns mapped to % of map width (floor spans ~10%–90%)
function colToMapPct(col){
  return 0.12 + (col / (COLS-1)) * 0.76;  // 12% to 88%
}
// Player Y positions: between/below lanes + one beyond top lane
// Player logical rows 0=bottom,1=first lane,2=second lane,3=third lane,4=fourth lane,5=top(goal)
const PLAYER_ROW_Y_PCT = [
  0.82,   // row 0: start (below all lanes)
  0.41,   // row 1: between lane 0 and 1 (safe zone above lane 0)
  0.50,   // row 2: between lane 1 and 2
  0.61,   // row 3: between lane 2 and 3
  0.725,  // row 4: below lane 3... wait, lanes go top→bottom
  0.28,   // row 5: above all lanes (goal)
];
// Rethink: map is top-down isometric, player moves UP (toward CHEGADA at top)
// row 0 = bottom (INÍCIO), row 5 = top (CHEGADA)
// Vertical positions for player safe zones between/around lanes
const SAFE_ROW_Y_PCT = [
  0.82,   // row 0: start bottom
  0.60,   // row 1: just below lane 3 (67.2%)
  0.50,   // row 2: between lane 2 (55.9%) and lane 3
  0.40,   // row 3: between lane 1 (45.9%) and lane 2
  0.31,   // row 4: between lane 0 (36.5%) and lane 1
  0.19,   // row 5: above lane 0 = GOAL
];
const TOTAL_ROWS = 6; // 0..5
const GOAL_ROW   = 5;

// NPC speed in map-width-units per second (will be scaled)
const BASE_SPEED = 0.28; // crosses screen in ~3.5s

// ═══════════════════════════════════════════════════════════
// ASSETS
// ═══════════════════════════════════════════════════════════
const imgs = {};
let loaded = 0, total = 0;

function loadImg(key, src){
  total++;
  const im = new Image();
  im.onload  = ()=>{ imgs[key]=im; loaded++; updateLoad(); };
  im.onerror = ()=>{ imgs[key]=null; loaded++; updateLoad(); };
  im.src = src;
}

function updateLoad(){
  const pct = total>0 ? loaded/total*100 : 0;
  document.getElementById('loading-bar').style.width = pct+'%';
  if(loaded >= total) setTimeout(onAssetsReady, 250);
}

function onAssetsReady(){
  document.getElementById('loading').style.display = 'none';
  showScreen('menu');
}

function initAssets(){
  loadImg('map',       '/ct-map.png');
  loadImg('casual',    '/ct-casual.png');
  loadImg('executivo', '/ct-executivo.png');
  loadImg('estudante', '/ct-estudante.png');
  loadImg('policial',  '/ct-policial.png');
  loadImg('idoso',     '/ct-idoso.png');
}

const NPC_TYPES = ['casual','executivo','estudante','policial','idoso'];

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
let authToken = null, authUser = null;
let playerPhoto = null, playerName = 'Visitante', playerInit = 'V';
let bestDist = 0;

window.addEventListener('message', e=>{
  const d = e.data;
  if(d?.type === 'DAILY_AUTH' || d?.type === 'AUTH_TOKEN'){
    authToken = d.token || null;
    authUser  = d.user  || null;
    if(authUser){
      playerName = authUser.name || authUser.username || 'Jogador';
      playerInit = (playerName[0]||'J').toUpperCase();
      applyAuthUI(authUser.avatar_url);
    }
    loadBestScore();
  }
});
window.parent.postMessage({type:'REQUEST_AUTH'},'*');
setTimeout(()=>{ if(!authToken && loaded>=total) onAssetsReady(); }, 2000);

function applyAuthUI(url){
  document.getElementById('menu-name').textContent = playerName;
  document.getElementById('menu-initials').textContent = playerInit;
  document.getElementById('go-initials').textContent   = playerInit;
  document.getElementById('go-name').textContent       = playerName;
  if(url){
    const ma = document.getElementById('menu-avatar');
    ma.src = url; ma.style.display = 'block';
    document.getElementById('menu-initials').style.display = 'none';
    const ga = document.getElementById('go-avatar');
    ga.src = url; ga.style.display = 'block';
    document.getElementById('go-initials').style.display = 'none';
    playerPhoto = new Image();
    playerPhoto.crossOrigin = 'anonymous';
    playerPhoto.src = url;
  }
}

async function loadBestScore(){
  try{
    const h = authToken ? {'Authorization':'Bearer '+authToken} : {};
    const r = await fetch('/api/crossing/score',{headers:h});
    if(r.ok){
      const d = await r.json();
      bestDist = d.best || 0;
      updateRecUI();
    }
  }catch(e){}
}

function updateRecUI(){
  document.getElementById('record-val').textContent = bestDist>0 ? bestDist+'m' : '—';
  document.getElementById('menu-rec').textContent   = bestDist>0 ? 'Recorde: '+bestDist+'m' : 'Sem recorde ainda';
}

async function saveScore(d){
  if(!authToken || d<=0) return;
  try{
    await fetch('/api/crossing/score',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
      body:JSON.stringify({score:Math.floor(d),phase:1})
    });
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let gs = 'menu';
let rafId = null;

// Player
const P = {
  col: Math.floor(COLS/2),
  row: 0,           // 0=bottom, 5=goal
  // animation
  moving: false,
  fromCol:0, fromRow:0, toCol:0, toRow:0,
  prog: 0,
  dir: null,
  // visual squash
  sqX:1, sqY:1,
  breathT: 0,
  bounceArc: 0,
};

let dist    = 0;
let frameN  = 0;
let lastAnn = 0;
let npcs    = [];
let npcSpawnTimer = 0;
let lastT   = 0;

// Difficulty
const ZONE_SPEEDS = [
  {from:0,   mult:1.0},
  {from:200, mult:1.35},
  {from:500, mult:1.7},
  {from:1000,mult:2.1},
];
function getSpeedMult(){
  let m=1;
  for(const z of ZONE_SPEEDS) if(dist>=z.from) m=z.mult;
  return m;
}

// ═══════════════════════════════════════════════════════════
// SCREEN → CANVAS COORDINATES
// ═══════════════════════════════════════════════════════════
// Map is drawn to fill canvas: drawImage(map, 0, 0, W, H)
// So map coords: (pct_x * W, pct_y * H)

function laneScreenY(laneIdx){
  // Lane Y on screen
  return MAP_LANE_Y_PCT[laneIdx] * H;
}

function rowScreenY(row){
  // Player row Y on screen
  return SAFE_ROW_Y_PCT[row] * H;
}

function colScreenX(col){
  return colToMapPct(col) * W;
}

// ═══════════════════════════════════════════════════════════
// NPC SYSTEM
// ═══════════════════════════════════════════════════════════
function spawnNPC(laneIdx){
  const dir = LANE_DIR[laneIdx];
  const spd = BASE_SPEED * getSpeedMult() * (0.75 + Math.random()*0.5);
  // Start off-screen
  const startX = dir === 1 ? -0.15 : 1.15; // in 0..1 map fraction
  return {
    laneIdx,
    xPct: startX,
    dir,
    speed: spd,       // map-width fraction per second
    type: NPC_TYPES[Math.floor(Math.random()*NPC_TYPES.length)],
    walkPhase: Math.random()*Math.PI*2,
    alive: true,
  };
}

function updateNPCs(dt){
  const mult = getSpeedMult();
  for(const n of npcs){
    n.xPct += n.dir * n.speed * dt;
    n.walkPhase += dt * 7;
    // Remove if off-screen
    if(n.dir===1 && n.xPct > 1.2) n.alive = false;
    if(n.dir===-1 && n.xPct < -0.2) n.alive = false;
  }
  npcs = npcs.filter(n=>n.alive);

  // Spawn timer
  npcSpawnTimer -= dt;
  if(npcSpawnTimer <= 0){
    // Spawn 1-2 NPCs on random lanes
    const count = Math.random()<0.3 ? 2 : 1;
    for(let i=0;i<count;i++){
      const lane = Math.floor(Math.random()*MAP_LANE_Y_PCT.length);
      // Don't spawn if too many NPCs on this lane
      const laneNpcs = npcs.filter(n=>n.laneIdx===lane).length;
      if(laneNpcs < 4) npcs.push(spawnNPC(lane));
    }
    // Spawn interval: shorter at higher distances
    const interval = Math.max(0.4, 1.2 - dist/1000);
    npcSpawnTimer = interval * (0.6 + Math.random()*0.8);
  }
}

// ═══════════════════════════════════════════════════════════
// COLLISION
// ═══════════════════════════════════════════════════════════
function checkCollision(){
  if(P.moving) return;
  // Player is on a "safe row" between lanes OR on goal
  // Only collide if player row corresponds to a lane
  // Row 0=bottom safe, 1,2,3,4 are between lanes but player crosses lanes during movement
  // Collision happens if player worldRow maps to a lane the player is currently crossing
  // During movement (moving=true), check if player is crossing a lane
  // Actually: collision should fire when player is AT a safe row but an NPC overlaps

  // Find if current player column/row overlaps any NPC
  // Player is in danger when their row is between safe zones (on a lane)
  // Simplified: check if ANY npc is very close to player's screen position
  const px = colScreenX(P.col);
  const py = rowScreenY(P.row);
  const pr = Math.min(W,H) * 0.055; // player radius

  for(const n of npcs){
    const nx = n.xPct * W;
    const ny = laneScreenY(n.laneIdx);
    // Only collide if same lane row (player must be in that lane's Y zone)
    const laneMid = laneScreenY(n.laneIdx);
    const laneThresh = H * 0.06;
    if(Math.abs(py - laneMid) > laneThresh) continue;
    // Check X overlap
    const npcW = getNPCWidth(n);
    if(Math.abs(nx - px) < (npcW*0.4 + pr)) {
      triggerGameOver();
      return;
    }
  }
}

function getNPCWidth(n){
  const img = imgs[n.type];
  if(!img) return W*0.06;
  const npcH = H * 0.13;
  return npcH * (img.naturalWidth / img.naturalHeight);
}

// ═══════════════════════════════════════════════════════════
// PLAYER MOVEMENT
// ═══════════════════════════════════════════════════════════
function tryMove(dir){
  if(P.moving || gs!=='playing') return;
  let nc=P.col, nr=P.row;
  if(dir==='up')    nr = Math.min(GOAL_ROW, P.row+1);
  if(dir==='down')  nr = Math.max(0, P.row-1);
  if(dir==='left')  nc = Math.max(0, P.col-1);
  if(dir==='right') nc = Math.min(COLS-1, P.col+1);
  if(nc===P.col && nr===P.row) return;
  P.moving=true; P.dir=dir;
  P.fromCol=P.col; P.fromRow=P.row;
  P.toCol=nc; P.toRow=nr;
  P.prog=0;
  P.sqX=0.88; P.sqY=1.12;
  playStep();
}

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
function update(dt){
  P.breathT += dt*1.6;

  if(P.moving){
    P.prog = Math.min(1, P.prog + dt*8); // ~125ms
    P.sqX += (1-P.sqX)*dt*14;
    P.sqY += (1-P.sqY)*dt*14;
    P.bounceArc = Math.sin(P.prog*Math.PI)*5;
    if(P.prog>=1){
      P.col=P.toCol; P.row=P.toRow;
      P.moving=false; P.bounceArc=0;
      P.sqX=1.04; P.sqY=0.96;
      if(P.dir==='up'){
        dist += 12; // each row = 12m
        document.getElementById('dist-display').textContent = Math.floor(dist);
      }
      // Goal reached?
      if(P.row === GOAL_ROW){
        dist += 50; // bonus
        document.getElementById('dist-display').textContent = Math.floor(dist);
        // Reset to bottom, keep going
        P.row=0; P.col=Math.floor(COLS/2);
        playWin();
      }
    }
  } else {
    P.sqX += (1-P.sqX)*dt*8;
    P.sqY += (1-P.sqY)*dt*8;
    P.bounceArc=0;
  }

  updateNPCs(dt);
  checkCollision();

  // Announcements
  const now = Date.now();
  const iv  = dist<200?90000:dist<500?70000:50000;
  if(now-lastAnn > iv){ lastAnn=now; doAnn(); }
}

function ease(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

// ═══════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════
function draw(){
  ctx.clearRect(0,0,W,H);

  // 1. Draw map background (fills entire canvas)
  const mapImg = imgs['map'];
  if(mapImg){
    ctx.drawImage(mapImg, 0, 0, W, H);
  } else {
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(0,0,W,H);
  }

  // 2. Draw NPCs (behind player on lower lanes, in front on upper lanes)
  // Sort: NPCs with higher laneIdx (lower on screen) drawn first
  const sortedNpcs = [...npcs].sort((a,b)=> b.laneIdx - a.laneIdx);
  for(const n of sortedNpcs){
    drawNPC(n);
  }

  // 3. Draw player
  drawPlayer();
}

function drawNPC(n){
  const img = imgs[n.type];
  if(!img) return;

  const sx = n.xPct * W;
  const sy = laneScreenY(n.laneIdx);

  // NPC height = 13% of canvas height, maintain aspect
  const npcH = H * 0.13;
  const npcW = npcH * (img.naturalWidth / img.naturalHeight);

  // Walk bob
  const bob = Math.sin(n.walkPhase) * 2.5;

  ctx.save();

  // Shadow
  ctx.globalAlpha = 0.22;
  ctx.fillStyle   = '#000';
  ctx.beginPath();
  ctx.ellipse(sx, sy+2, npcW*0.28, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // NPC image — mirror for left-moving
  if(n.dir === -1){
    ctx.translate(sx, sy - npcH*0.82 + bob);
    ctx.scale(-1, 1);
    ctx.drawImage(img, -npcW/2, 0, npcW, npcH);
  } else {
    ctx.drawImage(img, sx - npcW/2, sy - npcH*0.82 + bob, npcW, npcH);
  }

  ctx.restore();
}

function drawPlayer(){
  // Interpolate position
  let col, row;
  if(P.moving){
    const t = ease(P.prog);
    col = P.fromCol + (P.toCol-P.fromCol)*t;
    row = P.fromRow + (P.toRow-P.fromRow)*t;
  } else {
    col=P.col; row=P.row;
  }

  const sx = colScreenX(col);
  const sy = (SAFE_ROW_Y_PCT[Math.floor(row)] +
              (row%1) * (SAFE_ROW_Y_PCT[Math.min(GOAL_ROW,Math.ceil(row))] - SAFE_ROW_Y_PCT[Math.floor(row)])) * H;

  const breath = Math.sin(P.breathT)*1.5;
  const px = sx;
  const py = sy - P.bounceArc + breath;

  const r = Math.min(W,H) * 0.052;

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(P.sqX, P.sqY);

  // Shadow
  ctx.save();
  ctx.globalAlpha=0.28;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(0, r*0.85, r*0.55, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Clip circle
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.clip();

  if(playerPhoto && playerPhoto.complete && playerPhoto.naturalWidth>0){
    ctx.drawImage(playerPhoto, -r, -r, r*2, r*2);
  } else {
    const g=ctx.createLinearGradient(-r,-r,r,r);
    g.addColorStop(0,'#F5C518'); g.addColorStop(1,'#c8890a');
    ctx.fillStyle=g; ctx.fillRect(-r,-r,r*2,r*2);
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.font=`bold ${r*1.1}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(playerInit, 0, 0);
  }

  ctx.restore();

  // Yellow ring
  ctx.save();
  ctx.translate(px,py);
  ctx.scale(P.sqX,P.sqY);
  ctx.beginPath();
  ctx.arc(0,0,r+2.5,0,Math.PI*2);
  ctx.strokeStyle='#F5C518'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// GAME FLOW
// ═══════════════════════════════════════════════════════════
function initWorld(){
  P.col=Math.floor(COLS/2); P.row=0;
  P.moving=false; P.prog=0; P.sqX=1; P.sqY=1;
  P.breathT=0; P.bounceArc=0;
  npcs=[]; npcSpawnTimer=1.0;
  dist=0; frameN=0;
  lastAnn=Date.now()-40000;
  document.getElementById('dist-display').textContent='0';
}

function loop(ts=0){
  if(gs!=='playing'){rafId=null;return;}
  rafId=requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/1000,0.05);
  lastT=ts; frameN++;
  update(dt);
  draw();
}

function startGame(){
  showScreen('none');
  initWorld();
  gs='playing';
  startAmbient();
  lastT=performance.now();
  loop(lastT);
}

function restartGame(){
  showScreen('none');
  initWorld();
  gs='playing';
  startAmbient();
  lastT=performance.now();
  loop(lastT);
}

function pauseGame(){
  if(gs!=='playing') return;
  gs='paused'; cancelAnimationFrame(rafId); rafId=null;
  stopAmbient(); showScreen('pause');
}

function resumeGame(){
  if(gs!=='paused') return;
  showScreen('none'); gs='playing';
  startAmbient(); lastT=performance.now(); loop(lastT);
}

function goToMenu(){
  gs='menu'; cancelAnimationFrame(rafId); rafId=null;
  stopAmbient();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  showScreen('menu');
}

function goBackToDaily(){
  window.parent.postMessage({type:'CLOSE_GAME'},'*');
}

// ═══════════════════════════════════════════════════════════
// GAME OVER
// ═══════════════════════════════════════════════════════════
function triggerGameOver(){
  if(gs==='gameover') return;
  gs='gameover'; cancelAnimationFrame(rafId); rafId=null;
  playBump(); stopAmbient();
  if('speechSynthesis' in window) speechSynthesis.cancel();

  const isNew = dist>bestDist;
  if(isNew){ bestDist=Math.floor(dist); updateRecUI(); }
  saveScore(dist);

  document.getElementById('go-dist').textContent=Math.floor(dist)+'m';
  document.getElementById('go-best').textContent=bestDist+'m';
  document.getElementById('go-badge').style.display=isNew?'block':'none';
  if(isNew){
    const f=document.getElementById('rec-flash');
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  }
  fetchRankPos();
  showScreen('gameover');
  document.getElementById('ch-input').value='';
  document.getElementById('ch-results').innerHTML='';
}

async function fetchRankPos(){
  try{
    const r=await fetch('/api/crossing/ranking');
    const d=await r.json();
    const pos=(d.ranking||[]).findIndex(x=>x.user_id===authUser?.id);
    document.getElementById('go-rank').textContent=pos>=0?'#'+(pos+1):'#—';
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
// RANKING
// ═══════════════════════════════════════════════════════════
let rkFromGO=false;
function showRanking(){
  rkFromGO=(gs==='gameover');
  if(gs==='playing') pauseGame();
  showScreen('ranking'); switchRkTab('global');
}
function closeRanking(){
  if(rkFromGO) showScreen('gameover');
  else if(gs==='paused') showScreen('pause');
  else showScreen('menu');
}
function switchRkTab(t){
  document.getElementById('rt-global').classList.toggle('on',t==='global');
  document.getElementById('rt-friends').classList.toggle('on',t==='friends');
  loadRanking(t);
}
async function loadRanking(){
  const el=document.getElementById('rk-list');
  el.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Carregando...</div>';
  try{
    const h=authToken?{'Authorization':'Bearer '+authToken}:{};
    const r=await fetch('/api/crossing/ranking',{headers:h});
    const d=await r.json();
    const items=d.ranking||[];
    if(!items.length){el.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.25)">Nenhum registro ainda.</div>';return;}
    el.innerHTML=items.map((it,i)=>{
      const me=it.user_id===authUser?.id;
      const pm=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
      const av=it.avatar_url?`<img class="rk-av" src="${it.avatar_url}" style="display:block">`:`<div class="rk-av">${(it.name||'?')[0]}</div>`;
      return`<div class="rk-item${me?' me':''}"><div class="rk-pos">${pm}</div>${av}<div class="rk-info"><div class="rk-name">${it.name||'Jogador'}</div><div class="rk-user">@${it.username||'?'}</div></div><div class="rk-score">${it.best_score}m</div></div>`;
    }).join('');
  }catch(e){el.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.2)">Erro.</div>';}
}

// ═══════════════════════════════════════════════════════════
// CHALLENGE
// ═══════════════════════════════════════════════════════════
let chT=null,chCool={};
function searchCh(v){
  clearTimeout(chT);
  if(v.length<2){document.getElementById('ch-results').innerHTML='';return;}
  chT=setTimeout(()=>doSearch(v),350);
}
async function doSearch(v){
  if(!authToken){document.getElementById('ch-results').innerHTML='<div style="color:rgba(255,255,255,.3);font-size:11px;padding:4px">Faça login para desafiar.</div>';return;}
  try{
    const r=await fetch(`/api/crossing/search?q=${encodeURIComponent(v)}`,{headers:{'Authorization':'Bearer '+authToken}});
    const d=await r.json();
    const el=document.getElementById('ch-results');
    if(!(d.users||[]).length){el.innerHTML='<div style="color:rgba(255,255,255,.3);font-size:11px;padding:4px">Nenhum usuário.</div>';return;}
    el.innerHTML=d.users.map(u=>`<div class="ch-user" onclick="sendCh('${u.id}','${u.name}')">`+(u.avatar_url?`<img class="ch-uav" src="${u.avatar_url}">`:`<div class="ch-uav">${(u.name||'?')[0]}</div>`)+`<div class="ch-uname">${u.name}</div><div class="ch-ubtn">Desafiar →</div></div>`).join('');
  }catch(e){}
}
async function sendCh(uid,uname){
  if(chCool[uid]&&Date.now()-chCool[uid]<600000){alert('Aguarde antes de desafiar novamente.');return;}
  if(!authToken){alert('Faça login.');return;}
  try{
    const r=await fetch('/api/crossing/challenge',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},body:JSON.stringify({to_user_id:uid})});
    if(r.ok){chCool[uid]=Date.now();document.getElementById('ch-results').innerHTML=`<div style="color:#F5C518;font:700 12px sans-serif;padding:8px;text-align:center">✅ Desafio enviado para ${uname}!</div>`;}
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════════════
function showScreen(name){
  ['menu','gameover','ranking','pause'].forEach(s=>{
    document.getElementById('screen-'+s).classList.toggle('hidden',s!==name);
  });
  document.getElementById('hud').style.display  = name==='none'?'flex':'none';
  document.getElementById('dpad').style.display = name==='none'?'flex':'none';
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
window.addEventListener('keydown',e=>{
  if(gs!=='playing') return;
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();tryMove(m[e.key]);}
  if(e.key==='Escape') pauseGame();
});

let ts0=null;
canvas.addEventListener('touchstart',e=>{if(gs!=='playing')return;ts0={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
canvas.addEventListener('touchend',e=>{
  if(!ts0||gs!=='playing')return;
  const dx=e.changedTouches[0].clientX-ts0.x,dy=e.changedTouches[0].clientY-ts0.y,th=22;
  if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>th)tryMove(dx>0?'right':'left');}
  else{if(Math.abs(dy)>th)tryMove(dy>0?'down':'up');}
  ts0=null;
},{passive:true});

let dInt=null;
function dStart(dir){if(gs!=='playing')return;tryMove(dir);dInt=setInterval(()=>{if(gs==='playing')tryMove(dir);},180);}
function dEnd(){clearInterval(dInt);dInt=null;}

// ═══════════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════════
let aCtx=null,droneOsc=null,droneG=null;
function getAC(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume();return aCtx;}
function startAmbient(){
  try{const ac=getAC();droneOsc=ac.createOscillator();droneOsc.type='sine';droneOsc.frequency.value=52;droneG=ac.createGain();droneG.gain.value=0.015;droneOsc.connect(droneG);droneG.connect(ac.destination);droneOsc.start();}catch(e){}
}
function stopAmbient(){try{droneOsc?.stop();}catch(e){}droneOsc=null;droneG=null;}
function playStep(){
  try{const ac=getAC();const b=ac.createBuffer(1,Math.floor(ac.sampleRate*0.055),ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.22))*0.28;const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=0.3;s.connect(g);g.connect(ac.destination);s.start();}catch(e){}
}
function playBump(){
  try{const ac=getAC();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=190;o.frequency.exponentialRampToValueAtTime(55,ac.currentTime+0.35);g.gain.value=0.4;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.4);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.4);}catch(e){}
}
function playWin(){
  try{const ac=getAC();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=520;o.frequency.exponentialRampToValueAtTime(780,ac.currentTime+0.3);g.gain.value=0.3;g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.5);}catch(e){}
}
const ANNS=['Atenção passageiros. Mantenham-se atrás da faixa amarela.','Aguarde o desembarque antes de embarcar.','Cuide de seus pertences pessoais.','Trem aproximando-se da plataforma.','Portas em fechamento.','Respeite o fluxo de passageiros.'];
let lastAnnIdx=-1;
function doAnn(){
  if(!('speechSynthesis' in window))return;
  let i;do{i=Math.floor(Math.random()*ANNS.length);}while(i===lastAnnIdx);
  lastAnnIdx=i;
  const u=new SpeechSynthesisUtterance(ANNS[i]);
  u.lang='pt-BR';u.rate=0.82;u.pitch=0.88;u.volume=0.5;
  speechSynthesis.speak(u);
}
